services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U gateway"], interval: 5s, retries: 5 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes --save 60 1
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 5 }

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports: ["7373:7373"]
    env_file: .env
    restart: unless-stopped
    environment:
      PORT: 7373
      NODE_ENV: production
      EXPOSE_BOOTSTRAP: ${EXPOSE_BOOTSTRAP:-0}
      # override DATABASE_URL to postgres when using compose
      DATABASE_URL: postgres://gateway:gateway@postgres:5432/gateway
      REDIS_URL: redis://redis:6379
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-0}
      SEMANTIC_THRESHOLD: ${SEMANTIC_THRESHOLD:-0.92}
      CACHE_TTL_S: ${CACHE_TTL_S:-3600}
      SEMANTIC_CACHE_MAX_MEM: ${SEMANTIC_CACHE_MAX_MEM:-1000}
      SEMANTIC_CACHE_SCAN_CAP: ${SEMANTIC_CACHE_SCAN_CAP:-200}
      COMPRESSION_ENABLED: ${COMPRESSION_ENABLED:-0}
      COMPRESSION_MAX_TOKENS: ${COMPRESSION_MAX_TOKENS:-8192}
      COST_ROUTING_ENABLED: ${COST_ROUTING_ENABLED:-0}
      COST_WEIGHT: ${COST_WEIGHT:-5}
      LATENCY_WEIGHT: ${LATENCY_WEIGHT:-0.0005}
      HEADROOM_WEIGHT: ${HEADROOM_WEIGHT:-0.3}
      SUCCESS_WEIGHT: ${SUCCESS_WEIGHT:-2}
      ANTHROPIC_API_KEYS: ${ANTHROPIC_API_KEYS:-}
      KIRAAI_API_KEYS: ${KIRAAI_API_KEYS:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-cohere/embed-english-v3.0}
      EMBEDDING_FALLBACKS: ${EMBEDDING_FALLBACKS:-nvidia-nim/nvidia/nv-embed-v1,cloudflare-workers-ai/@cf/baai/bge-large-en-v1.5}
      ADAPTIVE_ROUTING_ENABLED: ${ADAPTIVE_ROUTING_ENABLED:-0}
      ADAPTIVE_EMA_ALPHA: ${ADAPTIVE_EMA_ALPHA:-0.3}
      PER_MODEL_QUOTA_ENABLED: ${PER_MODEL_QUOTA_ENABLED:-0}
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-1}
      BYOK_ENABLED: ${BYOK_ENABLED:-1}
      LOCAL_EMBEDDING_ENABLED: ${LOCAL_EMBEDDING_ENABLED:-0}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-Xenova/bge-small-en-v1.5}
      MCP_ENABLED: ${MCP_ENABLED:-0}
      COMPARE_MAX_CONCURRENCY: ${COMPARE_MAX_CONCURRENCY:-3}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_THRESHOLD_ERROR_RATE: ${ALERT_THRESHOLD_ERROR_RATE:-0.5}
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-25000}
      PROVIDER_TIMEOUT_AUTO_MS: ${PROVIDER_TIMEOUT_AUTO_MS:-12000}
      PROVIDER_TIMEOUT_REASONING_MS: ${PROVIDER_TIMEOUT_REASONING_MS:-60000}
      PROVIDER_PARALLEL_AUTO: ${PROVIDER_PARALLEL_AUTO:-3}
      PROVIDER_PARALLEL_DEFAULT: ${PROVIDER_PARALLEL_DEFAULT:-2}
    volumes:
      - gateway-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:7373/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["3000:80"]
    depends_on: [gateway]

volumes:
  pgdata:
  gateway-data:
  redisdata:
