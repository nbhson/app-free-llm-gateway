name: Sync freellms (daily 02:00 UTC) + verify

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no live probe, only freellms sync)"
        required: false
        default: "false"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Sync live models from providers (freellms.org disabled — not latest)
        run: |
          echo "Freellms sync disabled — using live provider APIs as source of truth"
          echo "If you still need freellms snapshot, run: python scripts/sync-freellms.py (manual)"
          # Live sync via provider APIs (requires secrets): cd apps/gateway && npx tsx src/jobs/sync-live-models.ts || true
          ls -lh data/live-models.json 2>&1 || echo "no live-models.json yet (run Sync Live Now with real keys)"

      - name: Install dependencies (root workspace — lockfile lives at root)
        run: npm ci

      - name: Verify free tiers (dry-run by default in CI, needs secrets for live)
        working-directory: apps/gateway
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run only"
            npx tsx src/jobs/verify-free.ts --dry-run
          else
            # Live verify requires API keys as secrets; if not set, it will mark unverified_no_key
            # Provide keys via GitHub Secrets: GROQ_API_KEYS, CEREBRAS_API_KEYS, etc.
            # We default to dry-run in CI unless SECRETS present
            if [ -n "${{ secrets.GROQ_API_KEYS }}" ]; then
              echo "Live verify with secrets"
              GROQ_API_KEYS="${{ secrets.GROQ_API_KEYS }}" CEREBRAS_API_KEYS="${{ secrets.CEREBRAS_API_KEYS }}" NVIDIA_API_KEYS="${{ secrets.NVIDIA_API_KEYS }}" npx tsx src/jobs/verify-free.ts || npx tsx src/jobs/verify-free.ts --dry-run
            else
              echo "No secrets, dry-run"
              npx tsx src/jobs/verify-free.ts --dry-run
            fi
          fi
          ls -lh ../../data/verified-*.json || true

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live-models.json data/model-health.json data/verified-models.json data/verified-summary.json || true
          git diff --cached --quiet || git commit -m "chore: sync live models + verify [skip ci]"
          git push || echo "no changes to push"
